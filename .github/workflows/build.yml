# Build and run TypeScript
name: Build and Run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run format
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
