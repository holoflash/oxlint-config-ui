<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>oxlint-rules-ui</title>
    <style>
      :root {
        --bg: #1e1e2e;
        --fg: #cdd6f4;
        --accent: #cba6f7;
        --accent-alt: #89b4fa;
        --border: #585b70;
        --selection-bg: #f5e0dc;
        --selection-fg: #11111b;
        --surface: #313244;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-size: 14px;
      }

      .flex-row {
        display: flex;
        flex-direction: row;
        height: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }

      .tui-box {
        border: 2px solid var(--border);
        border-radius: 8px;
        position: relative;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        margin: 0 8px;
      }

      .tui-box:first-child {
        margin-left: 0;
      }
      .tui-box:last-child {
        margin-right: 0;
      }

      .tui-box.active {
        border-color: var(--accent);
        box-shadow: 0 0 10px rgba(203, 166, 247, 0.1);
      }

      .tui-box.active .tui-title {
        color: var(--accent);
      }

      .tui-title {
        position: absolute;
        top: -12px;
        left: 14px;
        background: var(--bg);
        padding: 0 8px;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        color: var(--border);
      }

      .list-container {
        overflow-y: auto;
        flex: 1;
        padding: 12px 0;
        scrollbar-width: none;
      }

      .list-item {
        padding: 4px 16px;
        cursor: pointer;
        transition: all 0.1s ease;
      }

      .list-item.selected {
        background-color: var(--accent);
        color: var(--selection-fg);
        font-weight: bold;
      }

      .details-content {
        padding: 20px;
        overflow-y: auto;
        line-height: 1.6;
      }

      .prop-row {
        margin-bottom: 8px;
      }
      .prop-key {
        font-weight: bold;
        color: var(--accent-alt);
        margin-right: 8px;
      }

      a {
        color: var(--accent-alt);
        text-decoration: none;
        background: var(--surface);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .status-bar {
        margin-top: 1rem;
        padding: 8px 12px;
        background: var(--surface);
        border-radius: 6px;
        color: var(--fg);
        font-size: 0.75rem;
        display: flex;
        justify-content: space-between;
        opacity: 0.8;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="flex-row h-full">
      <div class="tui-box" id="pane-cats" style="width: 20%">
        <div class="tui-title">Categories</div>
        <div class="list-container" id="list-cats"></div>
      </div>

      <div class="tui-box" id="pane-rules" style="width: 30%">
        <div class="tui-title">Rules</div>
        <div class="list-container" id="list-rules"></div>
      </div>

      <div class="tui-box" id="pane-details" style="width: 50%">
        <div class="tui-title">Details</div>
        <div class="details-content" id="details-content">Loading...</div>
      </div>
    </div>

    <div class="status-bar">
      <span>[NAV]: Arrows / HJKL</span>
      <span>[SWITCH PANE]: Arrows / Click</span>
      <span id="rule-count">Rules: 0</span>
    </div>

    <script>
      window.__RULES__ = /* [[INJECT_DATA]] */ [];

      const state = {
        categories: [],
        rulesByCategory: {},
        activePane: "cats",
        catIndex: 0,
        ruleIndex: 0,
      };

      const els = {
        cats: document.getElementById("list-cats"),
        rules: document.getElementById("list-rules"),
        details: document.getElementById("details-content"),
        paneCats: document.getElementById("pane-cats"),
        paneRules: document.getElementById("pane-rules"),
        count: document.getElementById("rule-count"),
      };

      const sortName = (a, b) =>
        (a.name || a.id || "")
          .toString()
          .localeCompare((b.name || b.id || "").toString());

      function init() {
        const rules = window.__RULES__ || [];
        const groups = {};

        rules.forEach((rule) => {
          const cat = rule.category || "Uncategorized";
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(rule);
        });

        state.categories = Object.keys(groups).sort();
        state.categories.forEach((c) => groups[c].sort(sortName));
        state.rulesByCategory = groups;

        els.count.textContent = `Rules: ${rules.length}`;
        render();
      }

      function render() {
        renderList(els.cats, state.categories, state.catIndex, true);
        const curCat = state.categories[state.catIndex];
        const rules = state.rulesByCategory[curCat] || [];
        renderList(
          els.rules,
          rules.map((r) => r.value),
          state.ruleIndex,
          false,
        );
        renderDetails(rules[state.ruleIndex]);

        els.paneCats.classList.toggle("active", state.activePane === "cats");
        els.paneRules.classList.toggle("active", state.activePane === "rules");
      }

      function renderList(container, items, selIdx, isCat) {
        container.innerHTML = "";
        items.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "list-item" + (i === selIdx ? " selected" : "");
          div.textContent = isCat
            ? `${item} (${state.rulesByCategory[item]?.length})`
            : `${i + 1}. ${item}`;
          div.onclick = () => {
            if (isCat) {
              state.catIndex = i;
              state.ruleIndex = 0;
              state.activePane = "cats";
            } else {
              state.ruleIndex = i;
              state.activePane = "rules";
            }
            render();
          };
          container.appendChild(div);
        });
        container.children[selIdx]?.scrollIntoView({ block: "nearest" });
      }

      function renderDetails(rule) {
        els.details.innerHTML = "";
        if (!rule)
          return els.details.appendChild(
            document.createTextNode("No rule selected"),
          );

        const row = (key, val) => {
          const d = document.createElement("div");
          d.className = "prop-row";
          const k = document.createElement("span");
          k.className = "prop-key";
          k.textContent = key;
          d.append(k, " " + (val ?? "N/A"));
          els.details.appendChild(d);
        };

        row("Name:", rule.value);
        row("Category:", rule.category);
        row("Scope:", rule.scope);
        row("Default:", rule.default);
        row("Type Aware:", rule.type_aware);
        row("Fix:", rule.fix);

        els.details.appendChild(document.createElement("br"));

        const docsRow = document.createElement("div");
        docsRow.className = "prop-row";
        const docsKey = document.createElement("span");
        docsKey.className = "prop-key";
        docsKey.textContent = "Docs:";
        docsRow.appendChild(docsKey);

        if (rule.docs_url) {
          const a = document.createElement("a");
          a.href = rule.docs_url;
          a.target = "_blank";
          a.textContent = rule.docs_url;
          docsRow.appendChild(a);
        }
        els.details.appendChild(docsRow);
      }

      document.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (["arrowright", "l"].includes(k)) {
          state.activePane = "rules";
          return render();
        }
        if (["arrowleft", "h"].includes(k)) {
          state.activePane = "cats";
          return render();
        }

        const isCats = state.activePane === "cats";
        const max = isCats
          ? state.categories.length
          : state.rulesByCategory[state.categories[state.catIndex]]?.length ||
            0;

        if (["arrowdown", "j"].includes(k)) {
          if (isCats) {
            state.catIndex = (state.catIndex + 1) % max;
            state.ruleIndex = 0;
          } else state.ruleIndex = (state.ruleIndex + 1) % max;
          render();
        }
        if (["arrowup", "k"].includes(k)) {
          if (isCats) {
            state.catIndex = (state.catIndex - 1 + max) % max;
            state.ruleIndex = 0;
          } else state.ruleIndex = (state.ruleIndex - 1 + max) % max;
          render();
        }
      });

      init();
    </script>
  </body>
</html>
